name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[full,dev]"
      - name: Smoke import Vercel app
        run: python -c "from api import app; print(app.title)"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
