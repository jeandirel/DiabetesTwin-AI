name: CGMacros Full Benchmark

on:
  push:
    branches: [benchmark/cgmacros-full]
    paths:
      - ".github/workflows/cgmacros-benchmark.yml"
      - "src/diabetestwin/cgmacros.py"
      - "src/diabetestwin/real_predictor.py"
      - "scripts/download_cgmacros.py"
      - "scripts/preprocess_cgmacros.py"
      - "scripts/train_real_model.py"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Download official CGMacros forecasting CSVs
        run: python scripts/download_cgmacros.py --minimal
      - name: Preprocess Dexcom forecasting data
        run: python scripts/preprocess_cgmacros.py --glucose-source dexcom
      - name: Compare grouped real-data models
        run: python scripts/train_real_model.py --compare --split grouped
      - name: Train grouped HGB baseline
        run: python scripts/train_real_model.py --model hgb --split grouped
      - name: Print benchmark outputs
        run: |
          echo "=== Dataset summary ==="
          cat data/processed/cgmacros_forecasting.csv.gz.summary.json
          echo "=== Model comparison ==="
          cat artifacts/cgmacros_grouped_comparison.csv
          echo "=== HGB metrics ==="
          cat artifacts/cgmacros_hgb_grouped_metrics.json
      - name: Upload benchmark metrics
        uses: actions/upload-artifact@v4
        with:
          name: cgmacros-benchmark-metrics
          path: |
            data/processed/cgmacros_forecasting.csv.gz.summary.json
            artifacts/cgmacros_grouped_comparison.csv
            artifacts/cgmacros_hgb_grouped_metrics.json
          retention-days: 14
